name: fitness_and_dite_tracker
description: "Professional Fitness & Diet Tracking Platform v2.0"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Networking & Real-time
  dio: ^5.4.3
  socket_io_client: ^3.1.4
  
  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  
  # UI & Charts
  fl_chart: ^0.66.2
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  
  # Utilities
  intl: ^0.19.0
  image_picker: ^1.0.7
  mobile_scanner: ^7.2.0
  flutter_markdown: ^0.7.7+1
  supabase_flutter: ^2.12.4
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  
  # Code Generation
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
