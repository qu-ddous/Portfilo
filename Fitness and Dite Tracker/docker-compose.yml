version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    restart: always

  admin-panel:
    build: ./admin-panel
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always

# Note: Database is hosted on Supabase (Cloud), so no DB service needed here.
